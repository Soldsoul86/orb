name: Veil QR live check v8
on:
  push:
    branches: ['codex/veil-apk']
    paths: ['.github/workflows/veil-install-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/relay/requirements.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Live invitation page and unauthenticated APK checksum
        run: python tools/veil-install/browser_check.py --origin https://veil-relay-soldsoul86.onrender.com
      - name: Existing encrypted-envelope relay smoke
        run: python apps/veil/relay/smoke_https.py https://veil-relay-soldsoul86.onrender.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-live-install-page
          path: invitation-install.png
