name: Veil Live Relay Check
on:
  push:
    branches: ['codex/veil-apk']
    paths: ['.github/workflows/veil-live-relay.yml', 'apps/veil/relay/smoke_https.py', 'apps/veil/relay/smoke_purposes_https.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public HTTPS delivery with disposable opaque envelopes
        run: python apps/veil/relay/smoke_https.py https://veil-relay-soldsoul86.onrender.com
      - name: Verify purpose capabilities and private browser handoff
        run: python apps/veil/relay/smoke_purposes_https.py https://veil-relay-soldsoul86.onrender.com
