name: Veil Relay
on:
  push:
    branches: ['codex/veil-apk', 'codex/veil-purposes']
    paths: ['apps/veil/relay/**', '.github/workflows/veil-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veil_test
          POSTGRES_USER: veil_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veil_test -d veil_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/relay/requirements.txt
      - name: SQLite relay compatibility
        run: python -m unittest discover -s apps/veil/relay -v
      - name: Real PostgreSQL relay tests
        env:
          TEST_DATABASE_URL: postgresql://veil_test:disposable-ci-only@localhost:5432/veil_test
        run: python -m unittest discover -s apps/veil/relay -v
