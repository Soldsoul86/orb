name: Veil private guest product pilot
on:
  workflow_dispatch:
  push:
    branches: [feat/veil-discovery-guest-integration]
    paths:
      - '.github/workflows/veil-guest-pilot.yml'
      - 'apps/veil/app/**'
      - 'apps/veil/identity-core/**'
      - 'apps/veil/guest-web/matrix/pilot/**'
      - 'apps/veil/guest-web/matrix/integration/**'
permissions:
  contents: read
concurrency:
  group: veil-guest-pilot-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: apps/veil/guest-web/matrix/integration
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK and private homeserver
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start disposable private provider
        run: |
          python -m unittest test_boundary -v
          python -m unittest discover -s ../pilot -p test_policy.py -v
          python start.py --pilot
      - name: Browser crypto and hostile direct API tests
        run: |
          node ../pilot/serve.mjs --test > runtime/web.log 2>&1 &
          node ../pilot/test-browser.mjs
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-pilot-browser-results
          path: apps/veil/guest-web/matrix/pilot/evidence/*.json
          if-no-files-found: ignore
      - name: Destroy disposable accounts, keys and stores
        if: always()
        run: |
          python -c "import json,os,pathlib,signal; p=pathlib.Path('runtime/pids.json'); [os.kill(pid,signal.SIGTERM) for pid in json.loads(p.read_text())] if p.exists() else None"
          rm -rf runtime web
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MATRIX_RUST_REV: 56bc59112822e7eb25943a95e02502855cdeef2d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false
      - name: Cache official SDK build (no runtime keys)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: apps/veil/guest-web/matrix/integration/android/app/src/main/sdk
          key: matrix-crypto-android-x86_64-56bc59112822e7eb25943a95e02502855cdeef2d-v1
      - name: Build maintained upstream SDK Kotlin/JNI bindings
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          git init sdk-source
          git -C sdk-source remote add origin https://github.com/matrix-org/matrix-rust-sdk.git
          git -C sdk-source fetch --depth=1 origin "$MATRIX_RUST_REV"
          git -C sdk-source checkout --detach FETCH_HEAD
          test "$(git -C sdk-source rev-parse HEAD)" = "$MATRIX_RUST_REV"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          test_dir="$PWD"
          cd sdk-source
          cargo xtask kotlin build-android-library --package crypto-sdk --profile dev --only-target x86_64-linux-android --src-dir "$test_dir/android/app/src/main/sdk"
      - name: Save compiled SDK before instrumentation
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/veil/guest-web/matrix/integration/android/app/src/main/sdk
          key: matrix-crypto-android-x86_64-56bc59112822e7eb25943a95e02502855cdeef2d-v1
      - name: Compile native bindings and instrumentation before emulator startup
        run: |
          mkdir -p ../../../app/src/guestAndroidTest/assets
          echo '{}' > ../../../app/src/guestAndroidTest/assets/pilot-account.json
          gradle -p ../../.. -PveilPurposePreview=true -PveilGuestPilot=true :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --console=plain
      - name: Install pinned browser SDK and homeserver
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Enable runner KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Start disposable private provider
        run: python start.py --pilot
      - name: Prepare disposable instrumented app and private browser
        run: |
          python -c "import json,pathlib; pathlib.Path('../../../app/src/guestAndroidTest/assets/pilot-account.json').write_text(json.dumps(json.load(open('runtime/accounts.json'))[0]))"
          gradle -p ../../.. -PveilPurposePreview=true -PveilGuestPilot=true :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          node ../pilot/serve.mjs > runtime/web.log 2>&1 &
      - name: Actual Veil browser request and Android inbox UI reply
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb install -r apps/veil/app/build/outputs/apk/debug/app-debug.apk
            adb install -r apps/veil/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            node apps/veil/guest-web/matrix/pilot/test-android.mjs
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-pilot-android-results
          path: apps/veil/guest-web/matrix/pilot/evidence/*.json
          if-no-files-found: ignore
      - name: Record test APK provenance
        if: success()
        run: |
          mkdir -p ../pilot/evidence
          sha256sum ../../../app/build/outputs/apk/debug/app-debug.apk > ../pilot/evidence/apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ../../../app/build/outputs/apk/debug/app-debug.apk > ../pilot/evidence/apk-signing.txt
      - name: Installable emulator test APK (preview ID, disposable debug certificate)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veil-guest-pilot-emulator-apk
          path: |
            apps/veil/app/build/outputs/apk/debug/app-debug.apk
            apps/veil/guest-web/matrix/pilot/evidence/apk-*.txt
      - name: Destroy disposable accounts, APKs, keys and stores
        if: always()
        run: |
          python -c "import json,os,pathlib,signal; p=pathlib.Path('runtime/pids.json'); [os.kill(pid,signal.SIGTERM) for pid in json.loads(p.read_text())] if p.exists() else None"
          rm -rf runtime web ../../../app/src/guestAndroidTest/assets ../../../app/build
