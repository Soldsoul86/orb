name: Sign and Verify Keep Local 0.4 Discovery
on:
  pull_request:
    paths: ['apps/keep-local/**', '.github/workflows/keep-local-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: keep-local-creative-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/keep-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          run-id: 38392711999
          github-token: ${{ github.token }}
          name: creative-build
          path: apps/keep-local/compiled
      - uses: actions/download-artifact@v4
        with:
          run-id: 38392711999
          github-token: ${{ github.token }}
          name: creative-test-fixtures-NOT-PHONE-UPDATE
          path: apps/keep-local/fixtures
      - uses: actions/download-artifact@v4
        with:
          run-id: 38364349728
          github-token: ${{ github.token }}
          name: Keep-Local-0.3.0-signed-APK
          path: apps/keep-local/previous
      - name: Sign exact built APKs using public detached responses
        run: bash scripts/signing/sign-built-apks.sh
      - name: Package committed source
        run: git -C ../.. archive --format=zip --output=apps/keep-local/delivery/Keep-Local-0.4.0-source.zip HEAD apps/keep-local .github/workflows/keep-local-compile.yml .github/workflows/keep-local-android.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-signing-evidence
          path: apps/keep-local/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Keep-Local-0.4.0-signed-APK
          path: apps/keep-local/delivery/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: creative-signed-test-fixtures
          path: apps/keep-local/signed-fixtures/
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: creative-signed-test-fixtures
          path: creative-fixtures
      - uses: actions/download-artifact@v4
        with:
          run-id: 38392711999
          github-token: ${{ github.token }}
          name: visual-model-pack
          path: model-pack
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: bash apps/keep-local/scripts/creative-emulator.sh creative-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-evidence-api-${{ matrix.api }}
          path: apps/keep-local/evidence/
          retention-days: 30
