name: Keep Local Next Installable APK
on:
  pull_request:
    paths: ['apps/keep-local/**', '.github/workflows/keep-local-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: keep-local-next-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/keep-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Compile and test
        run: |
          python3 core-tests/db_contract.py
          python3 core-tests/recovery_contract.py
          bash gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - uses: actions/download-artifact@v4
        with:
          run-id: 38257971597
          github-token: ${{ github.token }}
          name: keep-local-debug-a5f34df0abb12e65758f81addbbb5ec3411fe9fe
          path: apps/keep-local/previous
      - name: Sign new independent app and encrypt signing backup
        env:
          ALLOW_INITIAL_SIGNING: 'true'
          KEEP_LOCAL_NEXT_KEYSTORE_BASE64: ${{ secrets.KEEP_LOCAL_NEXT_KEYSTORE_BASE64 }}
        run: bash scripts/sign-standalone.sh
      - name: Verify packaged identity and permissions
        run: |
          apkanalyzer manifest print delivery/Keep-Local-Next-0.2.0.apk > evidence/packaged-manifest.xml
          python3 scripts/check_packaged_manifest.py evidence/packaged-manifest.xml
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Keep-Local-Next-installable-APK
          path: apps/keep-local/delivery/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Keep-Local-Next-ENCRYPTED-signing-backup
          path: apps/keep-local/encrypted-signing-backup/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keep-Local-Next-build-reports
          path: |
            apps/keep-local/app/build/reports/
            apps/keep-local/app/build/test-results/
            apps/keep-local/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: next-emulator-fixtures
          path: apps/keep-local/test-artifacts/
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: next-emulator-fixtures
          path: next-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify side-by-side installation and exports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/keep-local/scripts/standalone-emulator.sh next-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-evidence-api-${{ matrix.api }}
          path: apps/keep-local/evidence/
          retention-days: 30
