name: Keep Local Share Export Verification
on:
  pull_request:
    paths: ['apps/keep-local/**', '.github/workflows/keep-local-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: keep-local-export-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/keep-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Schema and privacy checks
        run: python3 core-tests/db_contract.py
      - name: Compile unsigned product, tests, JVM tests and lint
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - uses: actions/download-artifact@v4
        with:
          run-id: 38257971597
          github-token: ${{ github.token }}
          name: keep-local-debug-a5f34df0abb12e65758f81addbbb5ec3411fe9fe
          path: apps/keep-local/previous
      - name: Prepare disposable emulator APKs; original-key release remains blocked
        run: bash scripts/prepare-export-verification.sh
      - name: Inspect compiled product
        run: |
          apkanalyzer manifest print app/build/outputs/apk/debug/app-debug-unsigned.apk > evidence/packaged-manifest.xml
          python3 scripts/check_packaged_manifest.py evidence/packaged-manifest.xml
          git rev-parse HEAD > evidence/commit.txt
      - name: Test summaries
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then cat app/build/reports/lint-results-debug.txt; fi
          if [ -d app/build/test-results/testDebugUnitTest ]; then cat app/build/test-results/testDebugUnitTest/TEST-*.xml; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keep-local-UNSIGNED-release-blocked-${{ github.sha }}
          path: |
            apps/keep-local/app/build/outputs/apk/debug/*unsigned.apk
            apps/keep-local/app/build/reports/
            apps/keep-local/evidence/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: disposable-emulator-fixtures-NOT-A-PHONE-UPDATE
          path: apps/keep-local/test-artifacts/
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: disposable-emulator-fixtures-NOT-A-PHONE-UPDATE
          path: export-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify sharing, export and fixture upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/keep-local/scripts/export-emulator.sh export-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-export-evidence-api-${{ matrix.api }}
          path: apps/keep-local/evidence/
          retention-days: 30
