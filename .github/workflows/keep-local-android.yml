name: Verify Existing Keep Local Next APK
on:
  pull_request:
    paths: ['apps/keep-local/**', '.github/workflows/keep-local-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: keep-local-next-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/keep-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          run-id: 38276184828
          github-token: ${{ github.token }}
          name: Keep-Local-Next-installable-APK
          path: apps/keep-local/delivery
      - uses: actions/download-artifact@v4
        with:
          run-id: 38276184828
          github-token: ${{ github.token }}
          name: next-emulator-fixtures
          path: apps/keep-local/test-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 38276184828
          github-token: ${{ github.token }}
          name: Keep-Local-Next-ENCRYPTED-signing-backup
          path: apps/keep-local/encrypted-signing-backup
      - name: Verify exact recovered APK, original certificate and encrypted backup
        run: |
          mkdir -p evidence
          echo 'b084edca59a156bc9f98ccc1ced38de45c0c1637c143b3eb82b75a5745c09f07  delivery/Keep-Local-Next-0.2.0.apk' | sha256sum -c -
          cmp delivery/Keep-Local-Next-0.2.0.apk test-artifacts/app.apk
          echo 'e2b823fe7ee9d4f242b20d781c76b283060c0ff441fc2862a3f2adf7d36dfa2a  test-artifacts/original.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/Keep-Local-Next-0.2.0.apk | tee evidence/signing-certificate.txt
          grep -F "$(cat signing/expected-certificate.sha256)" evidence/signing-certificate.txt
          apkanalyzer manifest print delivery/Keep-Local-Next-0.2.0.apk > evidence/packaged-manifest.xml
          python3 scripts/check_packaged_manifest.py evidence/packaged-manifest.xml
          openssl cms -cmsout -inform DER -in encrypted-signing-backup/keep-local-next.p12.cms -noout
          # Encrypted bytes only, for recovery into the user's private workspace.
          printf 'ENCRYPTED_BACKUP_BASE64='
          base64 -w0 encrypted-signing-backup/keep-local-next.p12.cms
          printf '\n'
      - uses: actions/upload-artifact@v4
        with:
          name: Keep-Local-Next-installable-APK-RECOVERED
          path: apps/keep-local/delivery/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: next-emulator-fixtures
          path: apps/keep-local/test-artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-apk-verification
          path: apps/keep-local/evidence/
          retention-days: 30
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: next-emulator-fixtures
          path: next-fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify side-by-side installation and exports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/keep-local/scripts/standalone-emulator.sh next-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-evidence-api-${{ matrix.api }}
          path: apps/keep-local/evidence/
          retention-days: 30
