name: Compile and Test Keep Local Indexing Stability
on:
  pull_request:
    paths: ['apps/keep-local/**', '.github/workflows/keep-local-android.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: keep-local-creative-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/keep-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        timeout-minutes: 3
        with:
          run-id: 38406294681
          github-token: ${{ github.token }}
          name: visual-model-pack
          path: apps/keep-local/model-delivery
      - uses: actions/download-artifact@v4
        timeout-minutes: 3
        with:
          run-id: 38406294681
          github-token: ${{ github.token }}
          name: creative-test-fixtures-NOT-PHONE-UPDATE
          path: apps/keep-local/prior-corpus
      - name: Verify pinned model and reuse unchanged real-photo corpus
        run: |
          python3 - <<'PYCORPUS'
          import pathlib,zipfile,hashlib,json
          model=json.loads(pathlib.Path('app/src/main/assets/visual-model.json').read_text())
          with zipfile.ZipFile('model-delivery/visual-model-pack.zip') as z:
              for name,meta in model['files'].items():
                  data=z.read(name);assert len(data)==meta['bytes'] and hashlib.sha256(data).hexdigest()==meta['sha256']
          out=pathlib.Path('app/src/androidTest/assets');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('prior-corpus/tests.apk') as z:
              for name in ['a.jpg','b.jpg','c.jpg','d.jpg','m0.mp4','m1.mp4','tokenizer-golden.json','corpus.json']:
                  (out/name).write_bytes(z.read('assets/'+name))
          PYCORPUS
      - name: Compile and test
        run: |
          python3 core-tests/db_contract.py
          python3 core-tests/library_contract.py
          python3 core-tests/indexing_contract.py
          bash gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Summarize JVM test results
        run: |
          python3 - <<'PYRESULTS'
          import pathlib,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in pathlib.Path('app/build/test-results').rglob('TEST-*.xml')]
          print('JVM_TEST_TOTALS', {k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')})
          PYRESULTS
      - uses: actions/download-artifact@v4
        with:
          run-id: 38394887256
          github-token: ${{ github.token }}
          name: Keep-Local-0.4.0-signed-APK
          path: apps/keep-local/previous
      - name: Prepare emulator fixtures and offline signing request
        run: |
          mkdir -p evidence delivery test-artifacts signing/responses
          cp app/build/outputs/apk/debug/app-debug-unsigned.apk delivery/Keep-Local-0.4.1-unsigned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -alias test -dname CN=Disposable-Emulator-Only -keyalg RSA -validity 2
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias test --ks-pass pass:android --out test-artifacts/app.apk delivery/Keep-Local-0.4.1-unsigned.apk
          "$signer" sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias test --ks-pass pass:android --out test-artifacts/baseline.apk previous/Keep-Local-0.4.0.apk
          "$signer" sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias test --ks-pass pass:android --out test-artifacts/tests.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          rm "$RUNNER_TEMP/test.jks"
          apkanalyzer manifest print delivery/Keep-Local-0.4.1-unsigned.apk > evidence/manifest.xml
          python3 scripts/check_packaged_manifest.py evidence/manifest.xml
          javac -cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" -d "$RUNNER_TEMP/classes" scripts/signing/DetachedSigner.java
          java -cp "$RUNNER_TEMP/classes:$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" DetachedSigner delivery/Keep-Local-0.4.1-unsigned.apk delivery/Keep-Local-0.4.1.apk signing/app-certificate.pem signing/responses > evidence/offline-signing-request.txt 2>&1 || true
          cat evidence/offline-signing-request.txt
          java -cp "$RUNNER_TEMP/classes:$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" DetachedSigner test-artifacts/tests.apk delivery/tests-signed.apk signing/app-certificate.pem signing/responses > evidence/test-offline-signing-request.txt 2>&1 || true
          cat evidence/test-offline-signing-request.txt
          sha256sum delivery/Keep-Local-0.4.1-unsigned.apk | tee evidence/unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-build
          path: |
            apps/keep-local/delivery/
            apps/keep-local/evidence/
            apps/keep-local/app/build/reports/
            apps/keep-local/app/src/main/assets/visual-model.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: creative-test-fixtures-NOT-PHONE-UPDATE
          path: apps/keep-local/test-artifacts/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: visual-model-pack
          path: apps/keep-local/model-delivery/
          retention-days: 90
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: creative-test-fixtures-NOT-PHONE-UPDATE
          path: creative-fixtures
      - uses: actions/download-artifact@v4
        with:
          name: visual-model-pack
          path: model-pack
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: bash apps/keep-local/scripts/creative-emulator.sh creative-fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-evidence-api-${{ matrix.api }}
          path: apps/keep-local/evidence/
          retention-days: 30


