name: Veil guest security gate
on:
  push:
    branches: ['codex/veil-guest-gate']
    paths: ['apps/veil/guest-web/**', 'apps/veil/identity-core/src/test/**', '.github/workflows/veil-guest-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/portable-provider/requirements.txt -r apps/veil/relay/requirements.txt
      - name: Baseline identity, app JVM and lint plus public Nimbus fixture
        env:
          VEIL_PUBLIC_FIXTURE: ${{ runner.temp }}/veil-public-state.json
        run: |
          gradle -p apps/veil --no-daemon --rerun-tasks -PveilPurposePreview=true :identity-core:test :app:testDebugUnitTest :app:lintDebug
          test -s "$VEIL_PUBLIC_FIXTURE"
      - name: Browser address, JOSE and presentation tests (no E2EE claim)
        env:
          VEIL_PUBLIC_FIXTURE: ${{ runner.temp }}/veil-public-state.json
        run: node apps/veil/guest-web/tests/core.test.mjs
      - name: Fail-closed HTTP and release gate
        run: python -m unittest discover -s apps/veil/guest-web/tests -v
      - name: Verify official package browser incompatibility
        run: bash apps/veil/guest-web/tests/probe_official_browser.sh
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Real Chromium identity verification and isolated UI
        env:
          VEIL_PUBLIC_FIXTURE: ${{ runner.temp }}/veil-public-state.json
        run: python apps/veil/guest-web/tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-guest-disabled-evidence
          path: |
            apps/veil/guest-web/evidence/
            apps/veil/identity-core/build/test-results/
            apps/veil/app/build/test-results/
            apps/veil/app/build/reports/lint-results-debug.html
  provider-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veil_test
          POSTGRES_USER: veil_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veil_test -d veil_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/portable-provider/requirements.txt -r apps/veil/relay/requirements.txt
      - name: Existing invitations, grants, portability and PostgreSQL isolation
        env:
          VEIL_TEST_POSTGRES_URL: postgresql://veil_test:disposable-ci-only@localhost:5432/veil_test
        run: python -m unittest discover -s apps/veil/portable-provider -v
      - name: Existing relay regression suite
        env:
          TEST_DATABASE_URL: postgresql://veil_test:disposable-ci-only@localhost:5432/veil_test
        run: python -m unittest discover -s apps/veil/relay -v
