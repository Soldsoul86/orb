name: Veil Purposes
on:
  push:
    branches: ['codex/veil-purposes']
    paths: ['apps/veil/**', '.github/workflows/veil-purposes.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: veil-purposes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/veil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r portable-provider/requirements.txt
      - run: python -m unittest discover -s portable-provider -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.veil-preview-signing/debug.keystore
          key: veil-purpose-preview-signing-v1
      - name: Prepare explicit preview signing identity
        run: |
          signing_file="$GITHUB_WORKSPACE/.veil-preview-signing/debug.keystore"
          pin_file="$GITHUB_WORKSPACE/apps/veil/preview-signing.sha256"
          if [ ! -f "$signing_file" ]; then
            if [ -f "$pin_file" ]; then
              echo '::error::Preview signing key is missing. Refusing to replace an installed identity. Restore the preserved key before publishing.'
              exit 1
            fi
            umask 077
            mkdir -p "$GITHUB_WORKSPACE/.veil-preview-signing"
            keytool -genkeypair -keystore "$signing_file" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Veil Purpose Development Preview'
          fi
          keytool -exportcert -keystore "$signing_file" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/veil-preview-cert.der"
          actual_cert=$(sha256sum "$RUNNER_TEMP/veil-preview-cert.der" | cut -d ' ' -f 1)
          if [ -f "$pin_file" ]; then test "$actual_cert" = "$(cat "$pin_file")"; fi
          echo "VEIL_DEBUG_KEYSTORE=$signing_file" >> "$GITHUB_ENV"
          echo "$actual_cert" > "$RUNNER_TEMP/veil-preview-cert.sha256"
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Compile and test without publishing an incompatible update
        run: gradle --no-daemon -PveilPurposePreview=true :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :identity-core:test :app:lintDebug --stacktrace
      - name: Download the actually distributed v5 preview
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Soldsoul86/orb
          run-id: 38774263922
          name: veil-purposes-preview-apk
          path: apps/veil/previous
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android native crypto, QR and privacy regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: apps/veil
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            gradle --no-daemon -PveilPurposePreview=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=chat.veil.ProtectionTest#nativeRevealReleaseCancelAndFocusLoss --stacktrace
            mkdir -p app/build/privacy-regression/native
            cp -R app/build/outputs/androidTest-results/. app/build/privacy-regression/native/
            gradle --no-daemon -PveilPurposePreview=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=chat.veil.ProtectionTest#flagIsSetBeforeAuthentication --stacktrace
            mkdir -p app/build/privacy-regression/flag
            cp -R app/build/outputs/androidTest-results/. app/build/privacy-regression/flag/
            gradle --no-daemon -PveilPurposePreview=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=chat.veil.UnlockRegressionTest,chat.veil.SafetyNumberTest,chat.veil.PurposeCipherTest,chat.veil.PurposeQrTest,chat.veil.PurposeEditorTest,chat.veil.ContactUiTest --stacktrace
            python scripts/upgrade_preview.py
      - name: Verify preview APK and signing identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/preview-apk-signature.txt"
          actual_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/preview-apk-signature.txt")
          test "$actual_cert" = "$(cat "$RUNNER_TEMP/veil-preview-cert.sha256")"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/preview-package.txt"
          grep -q "^package: name='chat.veil.purposes.preview'" "$RUNNER_TEMP/preview-package.txt"
          cp app/build/outputs/apk/debug/app-debug.apk veil-purposes-preview.apk
          sha256sum veil-purposes-preview.apk > veil-purposes-preview.apk.sha256
          cp "$RUNNER_TEMP/veil-preview-cert.sha256" veil-purposes-preview.certificate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: veil-purposes-preview-apk
          path: |
            apps/veil/veil-purposes-preview.apk
            apps/veil/veil-purposes-preview.apk.sha256
            apps/veil/veil-purposes-preview.certificate.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-purpose-test-reports
          path: |
            apps/veil/app/build/reports/
            apps/veil/app/build/outputs/androidTest-results/
            apps/veil/app/build/privacy-regression/
          if-no-files-found: ignore
