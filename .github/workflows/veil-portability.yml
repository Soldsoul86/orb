name: Veil Portability
on:
  push:
    branches: ['codex/veil-portability']
    paths: ['apps/veil/**', '.github/workflows/veil-portability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veil-portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Provider-neutral identity core
        run: gradle -p apps/veil --no-daemon :identity-core:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-core-reports
          path: apps/veil/identity-core/build/reports/
