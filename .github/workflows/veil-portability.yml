name: Veil Portability
on:
  push:
    branches: ['codex/veil-portability']
    paths: ['apps/veil/**', '.github/workflows/veil-portability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veil-portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/portable-provider/requirements.txt
      - run: python -m unittest discover -s apps/veil/portable-provider -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Provider-neutral identity core
        run: gradle -p apps/veil --no-daemon :identity-core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug -PveilPurposePreview=true --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Two Android devices and provider replacement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 1536 -cores 2
          script: |
            bash apps/veil/scripts/start_second_emulator.sh
            python apps/veil/scripts/portable_two_devices.py
            adb -s emulator-5556 emu kill
            gradle -p apps/veil --no-daemon -PveilPurposePreview=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=chat.veil.UnlockRegressionTest,chat.veil.ProtectionTest,chat.veil.SafetyNumberTest,chat.veil.PurposeCipherTest,chat.veil.PurposeQrTest,chat.veil.PurposeEditorTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-core-reports
          path: |
            apps/veil/identity-core/build/reports/
            apps/veil/app/build/reports/
            apps/veil/app/build/outputs/androidTest-results/
