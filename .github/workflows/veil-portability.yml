name: Veil Portability
on:
  push:
    branches: ['codex/veil-portability']
    paths: ['apps/veil/**', '.github/workflows/veil-portability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veil-portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/veil/portable-provider/requirements.txt
      - run: python -m unittest discover -s apps/veil/portable-provider -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Provider-neutral identity core
        run: gradle -p apps/veil --no-daemon :identity-core:test :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-core-reports
          path: |
            apps/veil/identity-core/build/reports/
            apps/veil/app/build/reports/tests/
