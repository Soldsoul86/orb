name: Veil live contact UI
on:
  push:
    branches: ['codex/veil-live']
    paths: ['apps/veil/**', '.github/workflows/veil-live-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build unchanged production sources and updated instrumentation
        run: gradle -p apps/veil --no-daemon -PveilPurposePreview=true :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Live HTTPS and rendered invitation QR on two fresh emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 1536 -cores 2
          script: |
            bash apps/veil/scripts/start_second_emulator.sh
            python apps/veil/scripts/live_contact_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-live-contact-ui
          path: apps/veil/ux-evidence/
