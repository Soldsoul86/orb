name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Every package compiles independently
        run: node scripts/typecheck-independently.mjs

      - name: Test
        run: npm test

      - name: Hard exit demonstration
        run: node scripts/simulate-hard-exit.mjs
