name: Veil APK
on:
  push:
    branches: ['codex/veil-apk']
    paths: ['apps/veil/**', '.github/workflows/veil-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veil-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/veil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore explicitly configured development signing identity
        env:
          VEIL_DEBUG_KEYSTORE_B64: ${{ secrets.VEIL_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$VEIL_DEBUG_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$VEIL_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/veil-debug.keystore"
            echo "VEIL_DEBUG_KEYSTORE=$RUNNER_TEMP/veil-debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Relay tests
        run: python3 -m unittest discover -s relay -v
      - name: Compile and test Android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unlock and concealment regression on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: apps/veil
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=chat.veil.UnlockRegressionTest,chat.veil.ProtectionTest,chat.veil.SafetyNumberTest --stacktrace
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/veil-signature.txt"
          cat "$RUNNER_TEMP/veil-signature.txt"
          actual_cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/veil-signature.txt")
          # Pin the certificate of the delivered 0.1.1 APK. Never silently publish
          # a new signing identity and tell existing users to erase their data.
          test "$actual_cert" = 'bfc5d191b2daff5eef95b531c4775a0c4f2d6564eaf2ab110922253b7f2e43da' || {
            echo '::error::APK signing identity differs from installed 0.1.1. Publication blocked. Restore the original key through VEIL_DEBUG_KEYSTORE_B64; see docs/ONBOARDING.md.'
            exit 1
          }
          cp app/build/outputs/apk/debug/app-debug.apk veil-debug.apk
          sha256sum veil-debug.apk > veil-debug.apk.sha256
          cat veil-debug.apk.sha256
          ls -lh veil-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: |
            apps/veil/veil-debug.apk
            apps/veil/veil-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-build-reports
          path: |
            apps/veil/app/build/reports/
            apps/veil/app/build/outputs/logs/
            apps/veil/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/veil-debug.keystore"
