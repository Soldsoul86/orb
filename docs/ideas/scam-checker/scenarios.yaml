    expect: { verdict: likely_scam, scam_type: sextortion, entity: police_or_agency,
              stage: money_or_info_requested, flags: [payment], pressure: 4 }
    note: Common second stage of sextortion (19% of all cases in 2025).

  - id: N11
    lang: en
    channel: sms
    input: >
      Your SIP of Rs 5,000 in Parag Parikh Flexi Cap Fund - Direct Growth has
      been processed. Units allotted: 58.214. -CAMS
    expect: { verdict: no_scam_signs, scam_type: none, entity: none, flags: [], pressure: 0 }
    note: Real investment message. Contrast with the C07–C12 funnel.

  - id: N12
    lang: en
    channel: whatsapp
    input: >
      College group: "Anyone holding Tata Motors? Thinking of averaging down."
      "I'm out, too volatile for me."
    expect: { verdict: no_scam_signs, scam_type: none, entity: none, flags: [], pressure: 0 }
    note: Friends discussing stocks is not a stock-tips scam.

  # ── D. Loans ──────────────────────────────────────────────────────────────

