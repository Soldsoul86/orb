    expect: { verdict: suspicious, scam_type: relative_impersonation, entity: relative_or_friend,
              stage: first_contact, flags: [], pressure: 0 }
    note: >
      Could be genuine. No money yet, but this is how the scam starts.
      Advice is "call them on the old number", not "this is a scam".

