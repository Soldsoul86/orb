# Scam Checker — message scenarios
#
# The test set every checker version must pass before the bot ships.
# Source of truth for expected behaviour; SCAM_TAXONOMY.md defines the ids.
#
# Fields
#   id          stable id, never reused
#   lang        en | hi | kn | ta | te | mr | bn | ml | hinglish | kanglish
#   channel     sms | whatsapp | call_summary | screenshot_text | email
#   input       what the user forwarded (links are defanged: hxxps, [.])
#   expect
#     verdict   stop_now | likely_scam | suspicious | no_scam_signs
#     scam_type id from SCAM_TAXONOMY.md section 1 (none for non-scams)
#     entity    impersonated_entity answer (section 2, question 4)
#     stage     victim_stage answer (only for scams)
#     flags     red flags that must be detected: otp_or_pin, payment, install_app
#     pressure  0..4, pressure_level answer
#   note        why the case exists (hard cases only)
#
# Probabilities are not asserted exactly; the verdict is the contract.
# All phone numbers, names and domains are invented.

scenarios:

  # ── A. Impersonating authority ────────────────────────────────────────────

  - id: A01
    lang: en
    channel: call_summary
    input: >
      Got a video call from a man in police uniform saying he is from Mumbai
      Cyber Crime. He says my Aadhaar was used to open a bank account for money
      laundering and I am under digital arrest. I must not tell my family and
      must transfer my savings to an RBI verification account for checking.
      He is still on the call.
    expect: { verdict: likely_scam, scam_type: digital_arrest, entity: police_or_agency,
              stage: money_or_info_requested, flags: [payment], pressure: 4 }

  - id: A02
    lang: en
    channel: call_summary
    input: >
      My father got a call from a "CBI officer" yesterday. He was on video for
      6 hours and sent ₹8,40,000 by RTGS to their account. Now they want more.
    expect: { verdict: stop_now, scam_type: digital_arrest, entity: police_or_agency,
              stage: money_or_info_already_given, flags: [payment], pressure: 4 }
    note: Money already sent. First line must stop the next payment ("now they want more").

  - id: A03
    lang: hinglish
    channel: call_summary
    input: >
      FedEx se call aaya, bole mere naam pe Taiwan ka parcel pakda gaya hai
      jisme 5 passport aur MDMA drugs hain. Press 1 kiya to Mumbai police ko
      connect kar diya.
    expect: { verdict: likely_scam, scam_type: courier_parcel, entity: courier,
              stage: engaged, flags: [], pressure: 4 }

  - id: A04
    lang: en
    channel: call_summary
    input: >
      Automated call: "This is TRAI. Your mobile number will be disconnected
      within 2 hours because it was used for illegal activities. Press 9 to
      speak to an officer."
    expect: { verdict: likely_scam, scam_type: telecom_disconnect, entity: telecom,
              stage: first_contact, flags: [], pressure: 4 }

  - id: A05
    lang: en
    channel: sms
    input: >
      Dear Consumer, your electricity power will be disconnected tonight at
      9.30 PM from electricity office because your previous month bill was not
      updated. Please immediately contact our electricity officer 98XXXXXX21.
    expect: { verdict: likely_scam, scam_type: utility_bill, entity: utility,
              stage: first_contact, flags: [payment], pressure: 4 }

  - id: A06
    lang: kn
    channel: sms
    input: >
      ಆತ್ಮೀಯ ಗ್ರಾಹಕರೇ, ನಿಮ್ಮ ವಿದ್ಯುತ್ ಬಿಲ್ ಬಾಕಿ ಇರುವುದರಿಂದ ಇಂದು ರಾತ್ರಿ 9 ಗಂಟೆಗೆ
      ಸಂಪರ್ಕ ಕಡಿತಗೊಳ್ಳುತ್ತದೆ. ತಕ್ಷಣ ಅಧಿಕಾರಿಯನ್ನು ಸಂಪರ್ಕಿಸಿ: 97XXXXXX45
    expect: { verdict: likely_scam, scam_type: utility_bill, entity: utility,
              stage: first_contact, flags: [payment], pressure: 4 }
    note: Kannada script version of A05.

  - id: A07
    lang: en
    channel: whatsapp
    input: >
      Vahan Parivahan: You have a pending traffic challan of Rs 500. Download
      the attached app to pay and avoid court action. [attachment: RTO_Challan.apk]
    expect: { verdict: likely_scam, scam_type: traffic_challan, entity: government,
              stage: first_contact, flags: [install_app, payment], pressure: 3 }

  - id: A08
    lang: en
    channel: sms
    input: >
      Income Tax Dept: You are eligible for a refund of Rs 15,490. Verify your
