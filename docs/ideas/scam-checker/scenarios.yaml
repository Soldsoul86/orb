      रोज़ ₹5,000 तक। अभी टेलीग्राम पर जुड़ें।
    expect: { verdict: likely_scam, scam_type: task_job, entity: employer,
              stage: first_contact, flags: [], pressure: 1 }

  - id: E07
    lang: en
